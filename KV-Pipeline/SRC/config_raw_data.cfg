# =============================================================================
# MAIN PIPELINE CONFIGURATION
# =============================================================================

[system]
# Define which GPUs the pipeline is allowed to use.
# - Single GPU: '0'
# - Multi-GPU: '0,1' (TIGRE will distribute the workload)
# - Force CPU only: '' (Empty string)
gpu_ids = '1'

[geometry]
# Source and Detector physical distances (in millimeters)
# dsd: Distance from Source to Detector
# dso: Distance from Source to Object (Origin)
dsd = 1050.0
dso = 576.28

# Curved Detector specifications
# ndetectorcurved: Number of detector pixels [Vertical (V), Horizontal (U)]
# ddetectorcurved: Physical size of a single detector pixel in mm [V, U]
ndetectorcurved = [32, 480]
ddetectorcurved = [2.75, 2.5]

# arc_length: Total arc length of the curved detector plate (in degrees)
arc_length = 65.8

# Physical dimensions of the total reconstructed field of view (in mm)
# svoxel_x: Length along the conveyor belt (Z-axis conceptually, X-axis in TIGRE).
#    In case of raw_dat: (This value will be an upperbound.
#            Actual svoxel_x will be calculated from displacements)
#    In case of simulation: (This will be true value)
# svoxel_y: Width of the tunnel
# svoxel_z: Height of the tunnel
svoxel_x = 1000.0
svoxel_y = 620.0
svoxel_z = 420.0

# Voxel resolution (in mm per voxel). Defines the output 3D grid density.
# E.g., [1.0, 1.0, 1.0] means every voxel represents 1 cubic millimeter.
# Lower numbers yield higher resolution but require exponentially more RAM.
#!change 
dvoxel = [1.0, 1.0, 1.0] 

# Scintillator hardware mapping
# nscintillators: Total number of scintillator modules
# sensorsperscintillator: Pixels per module [V, U]
# scintillatorsize: Physical dimension of one scintillator module [Height, Width] in mm
nscintillators = 30
sensorsperscintillator = [32, 16]
scintillatorsize = [88.0, 40.22]

# pscintillator_path: Path to a .npy file containing the (30x2) physical coordinates 
# of each scintillator module. Use 'default' to use the hardcoded internal array.
pscintillator_path = default

# shift_z: Z-axis offset (in mm) from the origin. Used to shift the reconstruction 
# center (OO' shift) if the object is elevated relative to the X-ray source.
shift_z = 50.0

[data-preprocessing]
# data_mode options: 
# - 'raw_dat': Reads actual machine sensor data (.dat files)
# - 'simulated': Forward-projects a virtual 3D numpy array (scene)
data_mode = raw_dat

########## Scanner Data (Used if data_mode = raw_dat) ##########
# object_file: The .dat file containing the scan of the target object
#!change 
object_file = ../May_26th/BS0.09_80RPM/data/CTP_BS0.09_80RPM.dat 

# air_files: A Python-formatted list of paths to air scans (scans with nothing on the belt).
# Multiple files can be provided to average out noise.
#!change 
air_files = ['../May_26th/BS0.09_80RPM/data/AirScan_BS0.09_80RPM.dat'] 

########## Simulation (Used if data_mode = simulated) ##########
# simulated_scene_path: Path to a 3D numpy array (.npy) representing the virtual object.
# The shape must match the geometry voxel calculation (geo.nVoxel).
#!change 
simulated_scene_path = ../Simulated_Scene/Scene1_converted.npy 

# sim_angles: Defines the virtual rotation angles [Start, End, Step] in degrees.
sim_angles = [0, 360, 0.25]

########## Hardware Specifics & File Formatting ##########
# meta_size: Number of 16-bit integers in the metadata header per view
# rows / cols: Total vertical and horizontal pixels per view
meta_size = 48
rows = 32
cols = 480

# ticks_per_projection: Difference between tick value between consecutive projections
# Is 16 if 720 projections per revolution, Is 8 if 1440 projections per revolution
ticks_per_projection = 8
# 16 - 240 || 8 - 480

# conveyor_speed: Speed of the belt in m/sec. Used strictly for debugging plots (displacement).
#!change 
conveyor_speed = 0.09

# revolution_speed: Angular speed of gantry in rpm
#!change 
revolution_speed = 80 

# t_max: Maximum value of the encoder ticks (determines angle calculation wrapping)
t_max = 65535

# Slicing limits for the dataset to ignore spin-up / spin-down unstable phases.
# These values dictate the exact index rows to extract from the .dat files.
# Set start_view = 0 and end_view = None to process the entire file.
# MAY26 BS0.09
start_view = 5000
end_view = 14000
# MAY26 BS0.05
# start_view = 6000
# end_view = 23000

[pipeline]
# init_algorithm: The algorithm used to generate the initial mathematical guess.
# Options: FDK (Feldkamp-Davis-Kress) because it is very fast and analytical.
#          ChunkFDK, a custom algorithm
#!change 
init_algorithm = ChunkFDK 

# recon_algorithm: The primary algorithm used for final output (e.g., FDK, CGLS, OS-SART).
# If this differs from init_algorithm, the init_algorithm's result is passed into this 
# one as the starting state (highly beneficial for iterative algorithms like CGLS).
#!change 
recon_algorithm = ChunkFDK 

# niter: Number of iterations. Only affects iterative algorithms (CGLS, SIRT, etc.).
niter = 20

# roll_angles: Shifts the projection angle array by this many elements. 
# Used to manually rotate the mathematical reconstruction so the conveyor belt 
# sits flat on the horizontal plane. Tune this once per physical scanner.
roll_angles = 480

# Caching options to speed up repeated runs
# save_processed_arrays: If True, saves the -log(I/I0) projections and angles to a .npz file
save_processed_arrays = True
#!change 
processed_save_path = ../May_26th/BS0.09_80RPM/_Iso1.0mm_Algo_FDK_CGLS/Projections/processed_data.npz 

# load_from_saved_path: If True AND the processed_save_path exists, the pipeline will 
# completely skip .dat file extraction/computation and instantly load the saved arrays.
load_from_saved_path = False

# recon_save_path: Directory where the final 3D reconstructed numpy array will be saved
#!change 
recon_save_path = ../May_26th/BS0.09_80RPM/_Iso1.0mm_Algo_FDK_CGLS/Recon/ 

[visualization]
# save_recon_gif: Saves a slice-by-slice GIF of the final 3D reconstructed volume
save_recon_gif = True

# save_projection_images: Saves individual 2D projection images (the sinogram inputs) as PNGs
save_projection_images = True
# save_frequency: Only save every Nth projection image (e.g., 50 means save 1 out of 50)
save_frequency = 50

# save_projection_gif: Combines the 2D projections into a single animated GIF
save_projection_gif = True
gif_fps = 5

# Directory to save all PNGs, GIFs, and debug plots
#!change 
recon_output_dir = ../May_26th/BS0.09_80RPM/_Iso1.0mm_Algo_FDK_CGLS/Recon/visualization/ 
#!change 
proj_output_dir = ../May_26th/BS0.09_80RPM/_Iso1.0mm_Algo_FDK_CGLS/Projections/visualization/ 

# generate_debug_plots: If True, plots timestamp intervals, machine displacement, and encoder ticks
generate_debug_plots = True

# Simulation visualization options (Only used if data_mode = simulated)
# plot_simulated_scene: Creates a GIF of the input virtual 3D scene before projection
plot_simulated_scene = True
#!change 
scene_output_dir = ../Simulated_Scenes/visualization/ 